name: nacos-config-export
rules:
  - method: GET
    path: "/v1/cs/configs?export=true&group=&tenant=&appName=&ids=&dataId="
    expression: |
      response.status == 200 && response.body.bcontains(b"PK") && response.content_type.contains("application/octet-stream")
detail:
  author: s4e-io
  links:
