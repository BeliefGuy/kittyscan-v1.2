name: poc-yaml-sharepoint-jwt-bypass-detect
groups:
  detect:
    - method: GET
      path: /
      follow_redirects: false
      expression: >
        response.status == 200 && (response.body.bcontains(b"SharePoint") || response.body.bcontains(b"Microsoft"))
    - method: GET
      path: /_layouts/15/start.aspx
      follow_redirects: false
      expression: >
        response.status == 200 && response.body.bcontains(b"SharePoint")
detail:
  author: L4xy
  description: "Microsoft SharePoint Server JWT身份认证绕过漏洞(CVE-2026-55040)影响版本检测，CVSS 9.1，已被CISA列入KEV目录"
  links:
    - https://github.com/sfewer-r7/cve-2026-55040
    - https://nvd.nist.gov/vuln/detail/CVE-2026-55040
  tags: sharepoint,jwt,bypass