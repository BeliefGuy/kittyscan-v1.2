name: poc-yaml-printer-default-credentials
groups:
  hp-admin:
    - method: GET
      path: /general/status.html
      follow_redirects: false
      expression: >
        response.status == 200 && (response.body.bcontains(b"HP") || response.body.bcontains(b"LaserJet") || response.body.bcontains(b"JetDirect"))
  hp-login:
    - method: POST
      path: /general/status.html
      headers:
        Content-Type: application/x-www-form-urlencoded
      body: >-
        admin=Admin&password=
      follow_redirects: false
      expression: >
        response.status == 200 && (response.body.bcontains(b"Set-Cookie") || !response.body.bcontains(b"Login"))
  canon-admin:
    - method: GET
      path: /rps/
      follow_redirects: false
      expression: >
        response.status == 200 && (response.body.bcontains(b"Canon") || response.body.bcontains(b"Remote UI"))
  epson-admin:
    - method: GET
      path: /PRESENTATION/HTML/TOP/TOP.HTML
      follow_redirects: false
      expression: >
        response.status == 200 && (response.body.bcontains(b"Epson") || response.body.bcontains(b"EPSON"))
detail:
  author: L4xy
  description: "打印机Web管理页面默认凭据检测，支持HP/Canon/Epson等品牌，可检测空密码或默认密码登录"
  links:
    - https://github.com/ihebski/DefaultCreds-cheat-sheet/blob/main/DefaultCreds-Cheat-Sheet.csv
    - https://www.joshualowcock.com/guide/guide-hp-printers-default-username-and-default-password-for-the-web-interface/
  tags: printer,default-credentials,hp,canon,epson