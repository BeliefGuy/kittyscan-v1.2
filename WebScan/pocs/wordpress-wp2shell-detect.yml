name: poc-yaml-wordpress-wp2shell-detect
groups:
  detect:
    - method: POST
      path: /wp-json/batch/v1
      headers:
        Content-Type: application/json
      body: >-
        {"requests":[{"path":"/wp/v2/posts","method":"GET","body":{},"headers":{}}]}
      follow_redirects: false
      expression: >
        response.status == 207 && response.body.bcontains(b"parse_path_failed") && response.body.bcontains(b"rest_batch_not_allowed")
detail:
  author: L4xy
  description: "WordPress 6.9.0-7.0.1存在预认证RCE漏洞(wp2shell)，通过REST批处理端点路由混淆可实现SQL注入，进而获取管理员权限并执行任意命令"
  links:
    - https://github.com/Icex0/wp2shell-poc/blob/main/README.md
    - https://slcyber.io/research-center/wp2shell-pre-authentication-rce-in-wordpress-core/
    - https://github.com/WordPress/wordpress-develop/security/advisories/GHSA-52p2-r8wf-jcrf
    - https://nvd.nist.gov/vuln/detail/CVE-2026-63030
  tags: rce,wordpress,wp2shell,sqli