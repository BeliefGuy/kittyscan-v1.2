name: spring-actuator-heapdump-exposed
groups:
  path1:
    - method: GET
      path: "/actuator/heapdump"
      expression: |
        response.status == 200 && (response.body.bcontains(b"JAVA PROFILE") || response.body.bcontains(b"HPROF"))
  path2:
    - method: GET
      path: "/heapdump"
      expression: |
        response.status == 200 && (response.body.bcontains(b"JAVA PROFILE") || response.body.bcontains(b"HPROF"))
  path3:
    - method: GET
      path: "/api/actuator/heapdump"
      expression: |
        response.status == 200 && (response.body.bcontains(b"JAVA PROFILE") || response.body.bcontains(b"HPROF"))
  path4:
    - method: GET
      path: "/management/heapdump"
      expression: |
        response.status == 200 && (response.body.bcontains(b"JAVA PROFILE") || response.body.bcontains(b"HPROF"))
detail:
  author: TyrusRC
  links:
    - https://docs.spring.io/spring-boot/docs/current/actuator-api/htmlsingle/#heapdump
