name: springboot-mappings-v2
groups:
  path1:
    - method: GET
      path: "/mappings"
      expression: |
        response.status == 200 && response.body.bcontains(b"mappings") && response.body.bcontains(b"method") && response.body.bcontains(b"produces")
  path2:
    - method: GET
      path: "/actuator/mappings"
      expression: |
        response.status == 200 && response.body.bcontains(b"mappings") && response.body.bcontains(b"method") && response.body.bcontains(b"produces")
