name: spring-actuator-env-exposed
groups:
  path1:
    - method: GET
      path: "/actuator/env"
      expression: |
        response.status == 200 && (response.body.bcontains(b"\"propertySources\"") || response.body.bcontains(b"\"activeProfiles\"") || response.body.bcontains(b"\"name\":\"systemEnvironment\"") || response.body.bcontains(b"systemproperties"))
  path2:
    - method: GET
      path: "/env"
      expression: |
        response.status == 200 && (response.body.bcontains(b"\"propertySources\"") || response.body.bcontains(b"\"activeProfiles\"") || response.body.bcontains(b"\"name\":\"systemEnvironment\"") || response.body.bcontains(b"systemproperties"))
  path3:
    - method: GET
      path: "/api/actuator/env"
      expression: |
        response.status == 200 && (response.body.bcontains(b"\"propertySources\"") || response.body.bcontains(b"\"activeProfiles\"") || response.body.bcontains(b"\"name\":\"systemEnvironment\"") || response.body.bcontains(b"systemproperties"))
  path4:
    - method: GET
      path: "/management/env"
      expression: |
        response.status == 200 && (response.body.bcontains(b"\"propertySources\"") || response.body.bcontains(b"\"activeProfiles\"") || response.body.bcontains(b"\"name\":\"systemEnvironment\"") || response.body.bcontains(b"systemproperties"))
detail:
