name: poc-yaml-druid-monitor-unauth
sets:
  path:
    - druid/index.html
    - druid/login.html
    - druid
rules:
  - method: GET
    path: /{{path}}
    follow_redirects: false
    expression: |
      response.status == 200 && (response.body.bcontains(b"Druid Stat Index") || response.body.bcontains(b"DruidVersion") || response.body.bcontains(b"DruidDrivers") || response.body.bcontains(b"druid/login") || response.body.bcontains(b"Druid Login"))
detail:
  author: met7or
  links:
    - https://github.com/alibaba/druid
