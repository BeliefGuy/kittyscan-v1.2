name: vmware-horizon-panel
groups:
  path1:
    - method: GET
      path: "/"
      follow_redirects: true
      expression: |
        response.status == 200 && (response.body.bcontains(b"Missing route token in request") || response.body.bcontains(b"VMware Horizon"))
  path2:
    - method: GET
      path: "/portal/webclient/index.html"
      follow_redirects: true
      expression: |
        response.status == 200 && (response.body.bcontains(b"Missing route token in request") || response.body.bcontains(b"VMware Horizon"))
detail:
  author: dhiyaneshDK,pdteam
  links:
    - https://www.exploit-db.com/ghdb/6496
