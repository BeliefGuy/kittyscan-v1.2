name: apache-nifi-unauth
rules:
  - method: GET
    path: "/nifi-api/flow/current-user"
    expression: |
      response.status == 200 && response.content_type.contains("json") && response.body.bcontains(b"\"identity\":\"anonymous\",\"anonymous\":true")
detail:
  author: l0ne1y
  links:
    - https://nifi.apache.org/
